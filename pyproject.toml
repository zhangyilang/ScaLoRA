[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scalora"
version = "0.1.0"
description = "ScaLoRA: Optimally Scaled Low-Rank Adaptation for Efficient High-Rank Fine-Tuning"
readme = "readme.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yilang Zhang" }]
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "peft>=0.15",
    "transformers>=4.52",
    "numpy",
]

[project.optional-dependencies]
# extra packages for the GLUE and commonsense reasoning experiments
experiments = [
    "accelerate",
    "datasets",
    "evaluate",
    "fire",
    "lm_eval==0.4.9",
    "protobuf",
    "scikit-learn",
    "scipy",
    "sentencepiece",
    "tiktoken",
]
test = [
    "accelerate",
    "pytest",
]

[project.urls]
Paper = "https://openreview.net/forum?id=Skxb4UgTWU"

[tool.setuptools.packages.find]
include = ["scalora*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
